services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sardar
      POSTGRES_PASSWORD: sardar
      POSTGRES_DB: sardars_mall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sardar -d sardars_mall"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
